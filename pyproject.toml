[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passes"
version = "1.0.0"
description = "Synthetic TLE visibility-window solver for a ground station"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "sgp4==2.23",
]

[project.scripts]
passes = "passes.cli:main"

[tool.setuptools.packages.find]
include = ["passes*"]
